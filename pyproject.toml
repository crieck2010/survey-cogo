[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-cogo"
version = "0.1.0"
description = "Coordinate geometry engine for surveying: inverses, traverses, intersections, areas"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["surveying", "cogo", "coordinate-geometry", "traverse"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/crieck2010/survey-cogo"

[tool.setuptools.packages.find]
where = ["src"]
